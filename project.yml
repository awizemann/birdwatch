name: Birdwatch
options:
  bundleIdPrefix: com.wizemann
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  configs:
    Release:
      # Notarization rejects get-task-allow; Xcode injects it unless told not to.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    CODE_SIGN_STYLE: Automatic
    # Set your own team for signed builds: `DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate`
    # (unsigned local builds work without it). Release signing lives in scripts/release.sh.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CURRENT_PROJECT_VERSION: 7
    MARKETING_VERSION: 0.1.3
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    # The swift-stats write key is deliberately NOT a setting here. Info.plist
    # references $(BW_STATS_WRITE_KEY), which xcodebuild expands from the
    # environment (scripts/release.sh unsets it, then sets it only as an env
    # prefix on the archive command) or an -xcconfig outside the repo, and to
    # "" when absent → analytics gated off
    # (UsageAnalytics.makeTracker). Keeping it out of project.yml means
    # `xcodegen generate` can never bake it into the committed .xcodeproj — and
    # any definition here, even empty, would override the environment. Never
    # pass it as a KEY=value xcodebuild argument (visible in `ps` and the build
    # log). Local test against the real backend:
    #   BW_STATS_WRITE_KEY=<key> xcodebuild … build
packages:
  # Sparkle auto-update framework (app target only). The app is NOT sandboxed
  # (ENABLE_APP_SANDBOX: NO), so Sparkle's standard installer path applies and
  # SUEnableInstallerLauncherService is not needed.
  # Floor 2.10.0 (still up-to-next-major): 2.9.6 carries installer security
  # fixes (symlink handling, root privilege escalation) and 2.10.0 fixes
  # delta-update file-system compression on macOS 27. 2.10 requires macOS 12+,
  # well under our 15.0 floor; the SPUStandardUpdaterController / SUFeedURL /
  # SUPublicEDKey wiring is unchanged by it.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
  # swift-stats: privacy-first usage analytics (Stats core + the Cloudflare
  # sink that speaks to api.swiftstats.co). Zero transitive dependencies.
  swift-stats:
    url: https://github.com/awizemann/swift-stats
    # 0.x: a minor release may break, so take patches only (0.3.x).
    minorVersion: "0.3.0"
targets:
  Birdwatch:
    type: application
    platform: macOS
    sources:
      - Birdwatch
    dependencies:
      - package: Sparkle
      - package: swift-stats
        product: Stats
      - package: swift-stats
        product: StatsCloudflare
    settings:
      base:
        # BW_BUNDLE_ID_SUFFIX is undefined (→ empty) everywhere except
        # scripts/build-detached.sh, which passes BW_BUNDLE_ID_SUFFIX=.dev so the
        # dogfood copy is com.wizemann.birdwatch.dev. A plain command-line
        # PRODUCT_BUNDLE_IDENTIFIER override would also restamp SwiftPM resource
        # bundles (swift-stats_Stats.bundle) with the app's id; this hook is
        # scoped to the app target. release.sh asserts the built id is exact.
        PRODUCT_BUNDLE_IDENTIFIER: com.wizemann.birdwatch$(BW_BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: "YES"
        # §13 merge base: Xcode generates Info.plist and merges it on top of
        # this partial file. Only keys the generator can't express live there
        # (SUFeedURL, SUPublicEDKey, BWStatsWriteKey, LSMinimumSystemVersion). Keeping
        # GENERATE_INFOPLIST_FILE YES is required — a full hand-written plist
        # would lose the generated CFBundle* keys.
        INFOPLIST_FILE: Birdwatch/Resources/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Alan Wizemann"
        INFOPLIST_KEY_LSUIElement: "NO"
        # Finder / Launchpad category. Utilities rather than Developer Tools:
        # Birdwatch is for any Mac user who wants to see what iCloud sync is
        # doing; developers are a secondary audience (charter identity).
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
      configs:
        # Tests run the Debug configuration; Release must not export every
        # internal symbol (larger binary, defeats dead-code stripping).
        Debug:
          ENABLE_TESTABILITY: "YES"
  BirdwatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BirdwatchTests
    dependencies:
      - target: Birdwatch
      # Recording sink + deterministic seams for the analytics tests.
      - package: swift-stats
        product: StatsTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wizemann.birdwatch.tests
        GENERATE_INFOPLIST_FILE: "YES"
